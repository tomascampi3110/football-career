name: Generar APK Android

on:
  workflow_dispatch:
  push:
    paths:
      - "**.py"
      - "assets/**"
      - "buildozer.spec"
      - ".github/workflows/build-android.yml"

jobs:
  build-apk:
    name: Compilar Football Career
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar dependencias del sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            openjdk-17-jdk \
            build-essential \
            git \
            zip \
            unzip \
            autoconf \
            libtool \
            pkg-config \
            zlib1g-dev \
            libncurses-dev \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            python3-dev

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar Buildozer
        run: |
          python -m pip install --upgrade pip
          python -m pip install buildozer cython==0.29.36

      - name: Compilar APK
        run: |
          yes | buildozer -v android debug

      - name: Publicar APK para descargar
        uses: actions/upload-artifact@v4
        with:
          name: football-career-debug-apk
          path: bin/*.apk
          if-no-files-found: error
          retention-days: 14
